function followCarrier(c){const carrier=c.carriedBy;if(!carrier||!carrier.alive){c.carriedBy=null;return;}if(c.grabVictim) return;let offX=0,offY=0;if(carrier.boost&&carrier.boost.phase==='boosting'){offX=-carrier.boost.dirX*CARRY_OFFSET;offY=-carrier.boost.dirY*CARRY_OFFSET;}else if(carrier.flightActive){offX=-carrier.dirX*CARRY_OFFSET;offY=-carrier.dirY*CARRY_OFFSET;}c.x=clamp(carrier.x+offX,c.r,MAP-c.r);c.y=clamp(carrier.y+offY,c.r,MAP-c.r);if(!carrier.flightActive&&collidesTree(c.x,c.y,c.r)) rescueIfStuck(c);}

function updateCharacter(c,dt){
  if(!c.alive) return;
  
  if(c.attackAnim.timer>0) c.attackAnim.timer=Math.max(0,c.attackAnim.timer-dt);
  if(c.pickupImmune>0) c.pickupImmune=Math.max(0,c.pickupImmune-dt);
  if(c.carriedGraceTimer>0) c.carriedGraceTimer=Math.max(0,c.carriedGraceTimer-dt);
  if(c.adrenalineTimer>0) c.adrenalineTimer=Math.max(0,c.adrenalineTimer-dt);
  if(c.slowTimer>0) c.slowTimer=Math.max(0,c.slowTimer-dt);
  if(c.allyBuffTimer>0) c.allyBuffTimer=Math.max(0,c.allyBuffTimer-dt);
  if(c.grabImmune>0) c.grabImmune=Math.max(0,c.grabImmune-dt);
  if(c.taranImmune>0) c.taranImmune=Math.max(0,c.taranImmune-dt);
  if(c.auraLockTimer>0) c.auraLockTimer=Math.max(0,c.auraLockTimer-dt);
  if(c.taranAuraLock>0) c.taranAuraLock=Math.max(0,c.taranAuraLock-dt);
  if(c._pendingSlow){c._pendingSlow.timer-=dt;if(c._pendingSlow.timer<=0){c.slowTimer=Math.max(c.slowTimer,c._pendingSlow.duration);c.slowAmount=c._pendingSlow.amount;c._pendingSlow=null;}}
  updateAcidPoison(c,dt);
  if(c.charType==='fleetway'&&c.alive){const mdx=c.x-c.prevX,mdy=c.y-c.prevY;const mdist=Math.hypot(mdx,mdy);if(mdist>0.01){const mang=Math.atan2(mdy,mdx);if(c.prevMoveAngle!==null){let diff=mang-c.prevMoveAngle;while(diff>Math.PI) diff-=Math.PI*2;while(diff<-Math.PI) diff+=Math.PI*2;if(Math.abs(diff)<FW_STRAIGHT_ANGLE_TOL) c.straightMoveTime+=dt;else c.straightMoveTime=0;}else c.straightMoveTime=0;c.prevMoveAngle=mang;}else{c.straightMoveTime=0;c.prevMoveAngle=null;}c.prevX=c.x;c.prevY=c.y;}
  c.webSlow=0;
  if(webs.length>0&&c.alive){for(const w of webs){const dx=c.x-(w.x+0.5),dy=c.y-(w.y+0.5),rr=c.r+0.5;if(dx*dx+dy*dy<rr*rr){c.webSlow=WEB_SLOW_AMOUNT;break;}}}
  if(c.charType==='blaze'){updateFlame(c,dt);updateBlazeSpearCooldown(c,dt);updateBlazeKick(c,dt);}
  if(c.charType==='acid'){updateAcidSaw(c,dt);updateAcidInfection(c,dt);}
  if(c.charType==='kolossos'&&c.alive){c.allSeeingTimer-=dt;if(c.allSeeingTimer<=0){c.allSeeingTimer=ALL_SEEING_INTERVAL;c.allSeeingActive=ALL_SEEING_DURATION;}if(c.allSeeingActive>0) c.allSeeingActive=Math.max(0,c.allSeeingActive-dt);}
  if(c.charType!=='executor'&&c.rage){c.rage.active=false;c.rage.accum=0;c.rage.used=false;c.rage.timer=0;}
  if(lmsActive&&lmsOwner===c&&c.charType==='vanilla'&&c.alive){c.lmsHealAccum+=dt;while(c.lmsHealAccum>=3){c.lmsHealAccum-=3;c.hp=Math.min(c.maxHp,c.hp+3);if(c.isPlayer) startHpAnim(c.hp);spawnHealParticle(c.x,c.y);}}
  if(c.isPlayer&&!c.isKiller&&c.carriedBy&&!c.grabVictim&&c.carriedGraceTimer<=0&&(joy.angle!==null||joy.active)){const carrier=c.carriedBy;if(carrier.boost) carrier.boost.carried=null;if(carrier.flightCarried) carrier.flightCarried=null;c.carriedBy=null;c.pickupImmune=0.6;}
  if(c.grabVictim) return;
  if(c.carriedBy){followCarrier(c);return;}
  if(c.boost.carried&&!c.boost.carried.alive) c.boost.carried=null;
  if(c.flightCarried&&!c.flightCarried.alive) c.flightCarried=null;
  if(c.dash.cooldown>0) c.dash.cooldown=Math.max(0,c.dash.cooldown-dt*cdMul(c));
  if(c.boost.cooldown>0) c.boost.cooldown=Math.max(0,c.boost.cooldown-dt*cdMul(c));
  if(c.controlImmunity>0) c.controlImmunity=Math.max(0,c.controlImmunity-dt);
  if(c.grab.cooldown>0) c.grab.cooldown=Math.max(0,c.grab.cooldown-dt*cdMul(c));
  if(c.stunTimer>0){c.stunTimer-=dt;if(c.stunTimer<=0){c.stunTimer=0;if(c.pendingImmunity){c.controlImmunity=CONTROL_IMMUNE;c.pendingImmunity=false;}}}
  if(c.charType==='kolossos'){updateTaran(c,dt);if(c.taran.phase!=='idle') return;updateBlock(c,dt);if(c.block.active) return;if(c.kolossosDash.active){updateKolossosDash(c,dt);return;}}
  if(c.charType==='fleetway'){updateFleetwayDash(c,dt);if(c.fleetwayDash.phase!=='idle') return;updateFleetwayBoom(c,dt);if(c.fleetwayBoom.phase!=='idle') return;updateFleetwayLaser(c,dt);if(c.fleetwayLaser.phase!=='idle') return;}
  if(c.charType==='acid'){if(c.acidSaw.active) return;}
  if(c.charType==='blaze'){if(c.blazeKick.active) return;if(c.flameActive){updateFlameCone(c,dt);}}
  if(c.dash.active){updateDashPhysics(c,dt);return;}
  if(c.boost.phase!=='idle'){updateBoostPhysics(c,dt);return;}
  if(c.charType==='muscles'){updatePunch(c,dt);updateStance(c,dt);if(c.punch.state==='lunging') return;}
  if(c.charType==='abel'){updateGun(c,dt);updateFlight(c,dt);if(c.gunState==='firing') return;if(c.flightActive) return;}
  if(c.charType==='vanilla'){updatePrayer(c,dt);updateVanillaDash(c,dt);if(c.vanillaDash.active) return;if(c.prayer.active) return;}
  if(c.charType==='cobalt'){updateOverdrive(c,dt);updateRepair(c,dt);if(c.overdrive.phase!=='idle') return;if(c.repair.active) return;}
  if(c.charType==='rober'){updateJetpack(c,dt);updateShield(c,dt);updateTrapCooldown(c,dt);}
  const isOtherGuestChar=netMode&&netIsHost&&c.netOwnerSession&&c.netOwnerSession!==netSessionId;
  if(netMode&&isOtherGuestChar){updateNetworkedCharacter(c,dt);}
  else if(c.isPlayer&&!(netMode&&netIsGuest)){
    if(c.isKiller){updatePlayerAsKiller(c,dt);}
    else if(c.charType==='abel'&&c.gunState==='charging'){}
    else if(c.charType==='muscles'&&c.punch.state==='charging'){}
    else if(c.flightActive){}
    else if(c.charType==='vanilla'&&(c.prayer.active||c.vanillaDash.active)){}
    else if(c.charType==='cobalt'&&(c.overdrive.phase!=='idle'||c.repair.active)){}
    else if(c.charType==='blaze'&&c.blazeKick.active){}
    else if(joy.angle!==null){c.dirX=Math.cos(joy.angle);c.dirY=Math.sin(joy.angle);tryMove(c,c.dirX*effSpeed(c)*dt,c.dirY*effSpeed(c)*dt);}
    const neroPhasing=c.charType==='nero'&&c.adrenalineTimer>0&&c.pk>0;
    if(!c.flightActive&&!neroPhasing) rescueIfStuck(c);
  } else if(c.isKiller&&!(netMode&&netIsHost&&c.netOwnerSession)){
    if(c.charType==='executor') updateKillerBot(c,dt);
    else if(c.charType==='kolossos') updateKolossosBot(c,dt);
    else if(c.charType==='fleetway') updateFleetwayBot(c,dt);
    else if(c.charType==='acid') updateAcidBot(c,dt);
  } else if(!(netMode&&(netIsHost||netIsGuest))){updateWandererSmart(c,dt);}
  else if(netMode&&netIsHost&&!c.netOwnerSession){updateWandererSmart(c,dt);}
}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ALL_SURVIVOR_TYPES=['blu','abel','muscles','vanilla','cobalt','rober','blaze','nero'];

function setupMap(){
  trees.length=0;treeGrid.fill(0);webs=[];piedSpecial.length=0;labGears.length=0;waterGrid.fill(0);
  if(selectedMap==='castle'){
    castleGrid=parseCastleMap();
    for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){const ch=castleGrid[y][x];if(ch==='#'||ch==='F') treeGrid[y*MAP+x]=1;}
    if(!castleTex) castleTex=makeCastleTex();
  } else if(selectedMap==='cave'){
    caveGrid=parseCaveMap();
    for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){const ch=caveGrid[y][x];if(ch==='#'||ch==='F') treeGrid[y*MAP+x]=1;}
    if(!caveTex) caveTex=makeCaveTex();webs=CAVE_WEBS.slice();
  } else if(selectedMap==='pied'){
    piedGrid=parsePiedMap();
    for(let y=0;y<MAP;y++) for(let x=0;x<MAP;x++){const ch=piedGrid[y][x];if(ch!==' ') treeGrid[y*MAP+x]=1;}
    if(!piedTex) piedTex=makePiedTex();collectPiedSpecials();
  } else if(selectedMap==='lab'){
    labGrid=parseLabMap();labRedWallsActive=true;labGearCooldown=0;
    if(!labTex) labTex=makeLabTex();collectLabGears();rebuildLabTreeGrid();
  } else if(selectedMap==='forest'){
    forestGrid=parseForestMap();
    treeGrid.fill(0); waterGrid.fill(0); trees.length=0;
    for(let y=0;y<MAP;y++){
      for(let x=0;x<MAP;x++){
        const ch=forestGrid[y][x];
        const idx=y*MAP+x;
        if(ch==='B'){ treeGrid[idx]=1; }
        else if(ch==='G'){ treeGrid[idx]=2; trees.push({x,y}); }
        else if(ch==='W'){ waterGrid[idx]=1; }
      }
    }
    if(!forestTex) forestTex=makeForestTex();
  }
  fleeField=null;fleeFieldTimer=0;heatGrid.fill(0);
}

function startGame(){setupMap();infoCharId=null;netMode=false;netIsGuest=false;netIsHost=false;playerIsKillerThisRun=Math.random()<0.20;lmsActive=false;lmsOwner=null;acceleratedRepairTime=0;bluAbelRescue=false;deathBloodPools.length=0;trapReveal={active:false,timer:0};lastWarnPlayed=-1;scoreState={phase:'none',timer:0,base:0,total:0,multipliers:[],rank:''};spectateTarget=null;chars=[player,bot1,bot2,bot3,bot4];player=chars[0];const spawns=getSpawns();const survSpawns=spawns.survivors,killSpawn=spawns.killer;if(playerIsKillerThisRun){applyKillerType(player,selectedHunter);resetCharacter(player,killSpawn[0]+0.5,killSpawn[1]+0.5);rescueIfStuck(player);killer=player;const shuffled=shuffle(ALL_SURVIVOR_TYPES).slice(0,4);const bots=[bot1,bot2,bot3,bot4];for(let i=0;i<4;i++){applySurvivorType(bots[i],shuffled[i]);bots[i].isKiller=false;resetCharacter(bots[i],survSpawns[i][0]+0.5,survSpawns[i][1]+0.5);rescueIfStuck(bots[i]);}}else{player.isKiller=false;applySurvivorType(player,selectedChar);resetCharacter(player,survSpawns[0][0]+0.5,survSpawns[0][1]+0.5);rescueIfStuck(player);const remaining=ALL_SURVIVOR_TYPES.filter(t=>t!==selectedChar);const shuffled=shuffle(remaining);applySurvivorType(bot1,shuffled[0]);bot1.isKiller=false;resetCharacter(bot1,survSpawns[1][0]+0.5,survSpawns[1][1]+0.5);rescueIfStuck(bot1);applySurvivorType(bot2,shuffled[1]);bot2.isKiller=false;resetCharacter(bot2,survSpawns[2][0]+0.5,survSpawns[2][1]+0.5);rescueIfStuck(bot2);applySurvivorType(bot3,shuffled[2]);bot3.isKiller=false;resetCharacter(bot3,survSpawns[3][0]+0.5,survSpawns[3][1]+0.5);rescueIfStuck(bot3);const chosenHunter=ALL_HUNTER_TYPES[Math.floor(Math.random()*ALL_HUNTER_TYPES.length)];applyKillerType(bot4,chosenHunter);resetCharacter(bot4,killSpawn[0]+0.5,killSpawn[1]+0.5);rescueIfStuck(bot4);killer=bot4;}projectiles.length=0;particles.length=0;effects.length=0;traps.length=0;spears.length=0;heatGrid.fill(0);displayHp=player.maxHp;hpAnimFrom=player.maxHp;hpAnimTo=player.maxHp;hpAnimT=1;gameOve function survivorsAliveCount(){let n=0;for(const c of chars){if(!c.isKiller&&c.alive) n++;}return n;}
function survivorsEscapedCount(){let n=0;for(const c of chars){if(!c.isKiller&&!c.alive&&c.escaped) n++;}return n;}
function checkEndGameKillerMode(){if(!playerIsKillerThisRun) return;const alive=survivorsAliveCount();if(alive===0){const escaped=survivorsEscapedCount();if(escaped===0){gameOver=true;gameResult='killer-win-all';deathTimer=2.5;AudioManager.play('win');}else if(escaped===4){gameOver=true;gameResult='killer-lose-all-escaped';deathTimer=2.5;AudioManager.play('lose');}else{gameOver=true;gameResult='killer-partial';deathTimer=2.5;AudioManager.play('win');}}}
function getRank(total){let pool;if(total<=250) pool=RANK_PHRASES.tier0;else if(total<=400) pool=RANK_PHRASES.tier1;else if(total<=550) pool=RANK_PHRASES.tier2;else if(total<=800) pool=RANK_PHRASES.tier3;else pool=RANK_PHRASES.tier4;return pool[Math.floor(Math.random()*pool.length)];}
function computeScore(){
  const multipliers=[];
  if(!playerIsKillerThisRun){
    if(player.escaped) multipliers.push({label:'сбежал',value:2.0,color:'#1a7f3a'});
    else if(!player.alive) multipliers.push({label:'умер',value:0.75,color:'#a02020'});
    else multipliers.push({label:'остался позади',value:0.9,color:'#a02020'});
    if((player.charType==='blu'||player.charType==='abel')&&bluAbelRescue) multipliers.push({label:'друзья навсегда',value:1.05,color:'#1a7f3a'});
    if((player.charType==='rober'||player.charType==='cobalt')&&acceleratedRepairTime>5) multipliers.push({label:'отец и сын',value:1.05,color:'#1a7f3a'});
    if(player.scoreStuns>=5) multipliers.push({label:'боец',value:1.15,color:'#1a7f3a'});
    if(lmsActive&&lmsOwner===player) multipliers.push({label:'последний выживший',value:2.0,color:'#1a7f3a'});
    if(player.chaseTimeActual>=100) multipliers.push({label:'В опасности',value:1.5,color:'#1a7f3a'});
    if(!player.tookDamageFromKiller) multipliers.push({label:'Неуязвимый',value:1.2,color:'#1a7f3a'});
    if(player.charType==='rober'&&(player.trapHits||0)>=5) multipliers.push({label:'Мастер план',value:1.05,color:'#1a7f3a'});
    if(player.charType==='vanilla'&&(player.scoreHealTotal||0)>100) multipliers.push({label:'Маленький медик',value:1.05,color:'#1a7f3a'});
    if(player.charType==='muscles'&&player.punchStreakAchieved) multipliers.push({label:'Яростный',value:1.15,color:'#1a7f3a'});
  } else {
    if(player.scoreKills===0) multipliers.push({label:'Упущенная возможность',value:0.9,color:'#a02020'});
    if(player.scoreStunReceived>30) multipliers.push({label:'сильные нападающие',value:1.25,color:'#1a7f3a'});
    if(player.scoreKills>=4) multipliers.push({label:'Ликвидация успешна',value:2.0,color:'#1a7f3a'});
  }
  multipliers.sort((a,b)=>a.value-b.value);
  let total=player.scoreBasic;for(const m of multipliers) total*=m.value;
  const rounded=Math.round(total);
  return {phase:'window',timer:5,base:Math.round(player.scoreBasic),total:rounded,multipliers,rank:getRank(rounded)};
}

function update(dt){
  if(netMode&&netIsGuest){updateHpAnim(dt);updateParticles(dt);updateEffects(dt);updateNetInterpolation(dt);if(gameOver){deathTimer-=dt;if(deathTimer<=0){scoreState=computeScore();gameOver=false;deathTimer=0;gameResult=null;gameState='scoring';}}return;}
  if(gameState==='scoring'){scoreState.timer-=dt;if(scoreState.phase==='window'&&scoreState.timer<=0){if(playerIsKillerThisRun){scoreState.phase='none';gameState='menu';}else{scoreState.phase='rank';scoreState.timer=3;}}else if(scoreState.phase==='rank'&&scoreState.timer<=0){scoreState.phase='none';gameState='menu';}return;}
  if(gameState!=='playing'&&gameState!=='spectating') return;
  updateHpAnim(dt);updateParticles(dt);updateEffects(dt);updateProjectiles(dt);updateSpears(dt);updateTraps(dt);
  if(trapReveal.active){trapReveal.timer-=dt;if(trapReveal.timer<=0||!killer.alive) trapReveal.active=false;}
  fleeFieldTimer-=dt;if(fleeFieldTimer<=0){recomputeFleeField();fleeFieldTimer=FLEE_FIELD_RECOMPUTE;}
  updateHeatGrid(dt);
  for(const c of chars){if(c.isKiller||!c.alive) continue;c.roleTimer-=dt;if(c.roleTimer<=0){c.roleTimer=AI_ROLE_RECOMPUTE;assignRoles();break;}}
  if(gameOver){
    deathTimer-=dt;
    if(deathTimer<=0){
      if(gameState==='playing' && !playerIsKillerThisRun && !player.alive && !player.escaped){
        gameOver=false; deathTimer=0; gameResult=null;
        gameState='spectating';
        spectateTarget=pickSpectateTarget();
      } else {
        scoreState=computeScore(); gameOver=false; deathTimer=0; gameResult=null;
        gameState='scoring';
      }
    }
    return;
  }
  if(!playerIsKillerThisRun&&player.alive&&!player.escaped){player.scoreBaseAccum+=dt;while(player.scoreBaseAccum>=1){player.scoreBaseAccum-=1;player.scoreBasic+=1;}if(killer&&killer.alive&&killer.charType==='executor'&&killer.rage&&killer.rage.active){player.scoreRageAccum+=dt;while(player.scoreRageAccum>=1){player.scoreRageAccum-=1;player.scoreBasic+=1;}}const chased=killerChasingSurvivor(player);if(chased) player.chaseTimeActual+=dt;if(player.charType==='rober'){if(!chased){player.scoreChaseAccum+=dt;while(player.scoreChaseAccum>=1){player.scoreChaseAccum-=1;player.scoreBasic+=1;}}}else{if(chased){player.scoreChaseAccum+=dt;while(player.scoreChaseAccum>=1){player.scoreChaseAccum-=1;player.scoreBasic+=1;}}}}
  if(!killer.rage.active){
    escapeTimer=Math.max(0,escapeTimer-dt);
    const secs=Math.ceil(escapeTimer);
    if(secs!==lastWarnPlayed&&(secs===60||secs===30||secs===10)){
      lastWarnPlayed=secs;
      AudioManager.play('warn');
    }
    if(escapeTimer<=ESCAPE_WARN_2&&!portal) spawnPortal();
    if(escapeTimer<=0){
      if(playerIsKillerThisRun){for(const c of chars){if(c.isKiller||!c.alive) continue;player.scoreKills+=1;player.scoreBasic+=(player.charType==='kolossos')?100:75;}gameOver=true;gameResult='killer-win-time';deathTimer=2.5;AudioManager.play('win');}
      else{gameOver=true;gameResult='lose-timer';deathTimer=2.5;AudioManager.play('lose');}
      return;
    }
  }
  if(portal) portal.active=!killer.rage.active;
  if(killer.alive&&killer.charType==='executor'&&killer.grab.phase!=='idle') updateGrab(killer,dt);
  for(const c of chars) updateKnockback(c,dt);
  for(const c of chars){
    const px=c.x, py=c.y;
    updateCharacter(c,dt);
    if(c.charType==='nero' && c.alive){
      const moved=Math.hypot(c.x-px,c.y-py)>0.005;
      updateNeroLogic(c,dt,moved);
    }
  }
  if(selectedMap==='pied') updatePiedSpecials(dt);
  if(selectedMap==='lab') updateLabGears(dt);
  applyAuraDamage(dt);
  if(portal&&portal.active){for(const c of chars){if(c.isKiller||!c.alive||c.grabVictim) continue;const dP=Math.hypot(c.x-portal.x,c.y-portal.y);if(dP<portal.r+c.r){spawnEscapeParticles(c.x,c.y);c.alive=false;c.escaped=true;if(c.isPlayer){AudioManager.play('win');gameOver=true;gameResult='win';deathTimer=2.5;}else AudioManager.play('escape');}}}
  checkLMS();
  if(playerIsKillerThisRun) checkEndGameKillerMode();
  if(netMode&&netIsHost){netSnapshotSendTimer+=dt;if(netSnapshotSendTimer>=NET_SNAPSHOT_INTERVAL){netSnapshotSendTimer-=NET_SNAPSHOT_INTERVAL;sendNetSnapshot();}}
  if(gameState==='spectating'){
    if(spectateTarget && (!spectateTarget.alive || spectateTarget.escaped)){
      spectateTarget=pickSpectateTarget();
    }
    const anySurvivorLeft=chars.some(c=>!c.isKiller && c.alive);
    if(!anySurvivorLeft || escapeTimer<=0){
      scoreState=computeScore();
      gameOver=false; deathTimer=0; gameResult=null;
      gameState='scoring';
    }
  }
}

  function wrapText(text,x,y,maxWidth,lineHeight){const paragraphs=String(text).split('\n');let curY=y;for(const para of paragraphs){const words=para.split(' ');let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,curY);line=word;curY+=lineHeight;}else line=test;}if(line){ctx.fillText(line,x,curY);curY+=lineHeight;}}}

  function renderOnlineLobby(){
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1410');bg.addColorStop(1,'#05100c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    const titleSize=Math.min(W,H)*0.06;
    ctx.fillStyle='#d8f6ff';ctx.font=`bold ${titleSize}px system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(79,216,255,0.6)';ctx.shadowBlur=20;ctx.fillText('ЛОББИ',W/2,50);ctx.shadowBlur=0;

    const bySlot={};for(const p of netLobbyState.players) bySlot[p.slot]=p;

    const cardH = Math.min(H*0.12, 90);

    const startY = Math.max(120, H*0.18);

      const col = i % 2; const row = Math.floor(i / 2);
      const cx = startX + col * (cardW + gapX);

      drawLobbySlot(cx, cy, cardW, cardH, i, bySlot[i], false);
    }

    const kY = startY + 2 * (cardH + gapY) + 10;

    ctx.fillText(`Игроков: ${netLobbyState.players.length}/5 • Карта: ${netLobbyState.mapId||'—'}`, W/2, btnY + btnH + 25);

  function drawLobbySlot(x, y, w, h, index, player, isKillerSlot){
    const selected = player && player.sessionId === netSessionId;
    const ready = player && player.ready;
    
    roundRect(x, y, w, h, 12);
    ctx.fillStyle = selected ? 'rgba(255,210,60,0.15)' : 'rgba(20,30,25,0.85)';
    ctx.fill();
    
    ctx.lineWidth = selected ? 3 : 2;
    ctx.strokeStyle = selected ? '#ffd400' : (isKillerSlot ? 'rgba(255,80,60,0.5)' : 'rgba(255,255,255,0.2)');
    ctx.stroke();

    const iconR = h * 0.3;
    const iconX = x + 25;
    const iconY = y + h/2;
    
    let fillColor = '#444';
    let charName = 'Пусто';
    let charType = player ? player.charType : '';
    
    if (player && charType) {
      fillColor = CHAR_INFO[charType] ? CHAR_INFO[charType].fill : '#fff';
      charName = CHAR_INFO[charType] ? CHAR_INFO[charType].name : charType;
    }

    ctx.beginPath();ctx.arc(iconX, iconY, iconR, 0, Math.PI*2);
    ctx.fillStyle = fillColor;ctx.fill();
    ctx.lineWidth = 2;ctx.strokeStyle = (charType==='executor'||charType==='kolossos'||charType==='fleetway'||charType==='acid') ? '#ff2400' : '#fff';ctx.stroke();

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    
    ctx.fillStyle = isKillerSlot ? '#ff5050' : '#7fd8ff';
    ctx.font = 'bold 12px system-ui, sans-serif';
    let slotLabel = isKillerSlot ? 'УБИЙЦА' : `ВЫЖИВШИЙ ${index+1}`;
    if (player && player.sessionId) slotLabel = player.sessionId.slice(0,8);
    ctx.fillText(slotLabel, x + 50, y + 25);

    if (player && charType) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.fillText(charName, x + 50, y + 50);
      
      if (ready) {
        ctx.fillStyle = '#4caf50';
        ctx.font = 'bold 13px system-ui, sans-serif';
        ctx.fillText('✔ ГОТОВ', x + 50, y + 72);

  function drawSpectateArrow(cx,cy,dir){
    const r=32;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fillStyle='rgba(20,30,25,0.85)';ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(dir*r*0.35,-r*0.5);
    ctx.lineTo(-dir*r*0.35,0);
    ctx.lineTo(dir*r*0.35,r*0.5);
    ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.stroke();
    ctx.restore();
  }
  function drawSpectatorUI(){
    const cx=W/2, cy=H-130;
    drawSpectateArrow(cx-120,cy,-1);
    drawSpectateArrow(cx+120,cy,+1);
    if(spectateTarget){
      ctx.fillStyle='#fff';ctx.font='bold 20px system-ui, -apple-system, sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=6;
      ctx.fillText(spectateTarget.name, cx, cy-4);
      ctx.shadowBlur=0;
      ctx.font='bold 12px system-ui, -apple-system, sans-serif';
      ctx.fillStyle=spectateTarget.isKiller ? '#ff5555' : '#7fd8ff';
      ctx.fillText(spectateTarget.isKiller ? 'УБИЙЦА' : 'ВЫЖИВШИЙ', cx, cy+18);
    } else {
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='bold 16px system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('...', cx, cy);
    }
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px system-ui';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Наблюдение', cx, cy-60);
    const bw=200,bh=46;
    const bx=(W-bw)/2, by=H-bh-20;
    roundRect(bx,by,bw,bh,bh/2);
    const grd=ctx.createLinearGradient(bx,by,bx,by+bh);
    grd.addColorStop(0,'#6b7a75');grd.addColorStop(1,'#3a4642');
    ctx.fillStyle=grd;ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=4;
    ctx.fillText('Продолжить', bx+bw/2, by+bh/2+1);
    ctx.shadowBlur=0;
  }

function drawKillerAttackAnim(k){
  if(!k.attackAnim||k.attackAnim.timer<=0) return;
  const img=attackImages[k.charType];
  if(!img||!img.complete||!img.naturalWidth) return;
  const el=KILLER_ATTACK_DURATION-k.attackAnim.timer;
  const fIdx=Math.min(img.frames-1,Math.floor(el/KILLER_ATTACK_DURATION*img.frames));
  const ang=Math.atan2(k.attackAnim.dirY,k.attackAnim.dirX);
  const dist=k.r+0.3;
  const px=k.x+Math.cos(ang)*dist;
  const py=k.y+Math.sin(ang)*dist;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(ang+Math.PI/2);
  ctx.scale(2.0,2.5);
  ctx.drawImage(img,fIdx*img.frameW,0,img.frameW,img.frameH,-0.55,-0.55,1.1,1.1);
  ctx.restore();
}
function drawKillerGrabHands(k){
  if(!k||k.charType!=='executor') return;
  if(k.grab.phase!=='holding'||!k.grab.victim) return;
  if(!grabHandsImage.complete||!grabHandsImage.naturalWidth) return;
  const ang=Math.atan2(k.grab.dirY,k.grab.dirX);
  const d=GRAB_OFFSET*0.5;
  const px=k.x+Math.cos(ang)*d;
  const py=k.y+Math.sin(ang)*d;
  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(ang+Math.PI/2);
  ctx.scale(2.0,2.0);
  ctx.drawImage(grabHandsImage,-0.5,-0.5,1.0,1.0);
  ctx.restore();
}
 
  let last=performance.now();
  function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;if(netMode&&netIsGuest){netSendTimer+=dt;if(netSendTimer>=NET_SEND_INTERVAL){netSendTimer-=NET_SEND_INTERVAL;sendNetInput();}}update(dt);render();requestAnimationFrame(loop);}
  resize();requestAnimationFrame(loop);
